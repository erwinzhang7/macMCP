name: Release

# On a v* tag, build a prebuilt macMCP.app and attach it to the GitHub release.
# NOTE: CI has no Developer ID, so this artifact is AD-HOC signed and NOT notarized — Gatekeeper
# will quarantine it on download. Users must clear quarantine (see the release notes), and TCC
# grants won't persist across versions. Building from source (`make install`) with your own
# signing identity remains the recommended install. Notarization would require a paid Apple
# Developer ID + an APPLE_ID/Team in repo secrets, which can be added to this job later.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prebuilt:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build + package (ad-hoc signed)
        run: MACMCP_SIGN_IDENTITY=- ./scripts/package-app.sh

      - name: Zip the app
        run: ditto -c -k --keepParent macMCP.app macMCP.app.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" macMCP.app.zip --clobber
